name: Daily Quote Post (Video Bot)

on:
  schedule:
    # 15:00 UTC = 8:30 PM IST — a few hours after the picture bot so the
    # two posts don't land back-to-back. Adjust as you like.
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (generate only, do not post to Instagram)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    # The ON/OFF switch for THIS bot only: repository variable
    # VIDEO_POSTING_ENABLED. Set it to "false" to pause this daily video
    # post — manual "Run workflow" runs always go through regardless of
    # the switch. The picture/quote bot has its own separate switch,
    # QUOTE_POSTING_ENABLED, in daily-quote-post.yml.
    if: github.event_name != 'schedule' || vars.VIDEO_POSTING_ENABLED != 'false'
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare today's reel
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          IG_HANDLE: ${{ secrets.IG_HANDLE }}
        run: python bot_video.py prepare

      - name: Commit and push the generated reel
        run: |
          git config user.name "igauto-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posts/video/ fonts/ posts/used_history.json || true
          git diff --quiet --cached || git commit -m "Prepare video-bot reel $(date -u +'%Y-%m-%d')"
          git push

      - name: Wait for raw GitHub URL to propagate
        run: sleep 15

      - name: Publish to Instagram
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: python bot_video.py publish

      - name: Commit the Instagram media ID
        run: |
          git add posts/video/
          git diff --quiet --cached || git commit -m "Record video-bot publish result $(date -u +'%Y-%m-%d')"
          git push
