name: Daily Quote Post (Picture Bot)

on:
  schedule:
    # 13:00 UTC = 6:30 PM IST. Adjust to whatever time you want it to post.
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (generate only, do not post to Instagram)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    # The ON/OFF switch for THIS bot only: a repository VARIABLE (not
    # secret) named QUOTE_POSTING_ENABLED. Set it to "false" to pause
    # this daily quote/picture post — the whole job is skipped (shows as
    # "skipped" in the Actions tab, not a failure). Manually running via
    # "Run workflow" always works regardless of this switch, so you can
    # still test/post on demand while it's paused. Unset/anything else =
    # posting stays on. The video bot has its own separate switch,
    # VIDEO_POSTING_ENABLED, in daily-video-post.yml.
    if: github.event_name != 'schedule' || vars.QUOTE_POSTING_ENABLED != 'false'
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare today's reel
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          IG_HANDLE: ${{ secrets.IG_HANDLE }}
          OPENVERSE_CLIENT_ID: ${{ secrets.OPENVERSE_CLIENT_ID }}
          OPENVERSE_CLIENT_SECRET: ${{ secrets.OPENVERSE_CLIENT_SECRET }}
        run: python bot_picture.py prepare

      - name: Commit and push the generated reel
        run: |
          git config user.name "igauto-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posts/picture/ fonts/ posts/used_history.json || true
          git diff --quiet --cached || git commit -m "Prepare picture-bot reel $(date -u +'%Y-%m-%d')"
          git push

      # A short pause so raw.githubusercontent.com has a moment to reflect
      # the file that was just pushed, before Instagram tries to fetch it.
      - name: Wait for raw GitHub URL to propagate
        run: sleep 15

      - name: Publish to Instagram
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: python bot_picture.py publish

      - name: Commit the Instagram media ID
        run: |
          git add posts/picture/
          git diff --quiet --cached || git commit -m "Record picture-bot publish result $(date -u +'%Y-%m-%d')"
          git push
