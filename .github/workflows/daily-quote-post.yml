name: Daily Quote Post (Picture Bot)

on:
  schedule:
    # 13:00 UTC = 6:30 PM IST. Adjust to whatever time you want it to post.
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (generate only, do not post to Instagram)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare today's reel
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          IG_HANDLE: ${{ secrets.IG_HANDLE }}
        run: python bot_picture.py prepare

      - name: Commit and push the generated reel
        run: |
          git config user.name "igauto-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posts/picture/ fonts/ || true
          git diff --quiet --cached || git commit -m "Prepare picture-bot reel $(date -u +'%Y-%m-%d')"
          git push

      - name: Wait for raw GitHub URL to propagate
        run: sleep 15

      - name: Publish to Instagram
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: python bot_picture.py publish

      - name: Commit the Instagram media ID
        run: |
          git add posts/picture/
          git diff --quiet --cached || git commit -m "Record picture-bot publish result $(date -u +'%Y-%m-%d')"
          git push
